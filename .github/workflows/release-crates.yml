name: release-crates

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Publishes the version in Cargo.toml to crates.io. crates.io is immutable:
      # a version can only be published once (then yanked, never replaced), so the
      # tag's Cargo.toml version must not already be on crates.io.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
